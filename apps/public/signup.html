<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register — OIDC Server</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: system-ui, sans-serif;
        background: #f5f5f5;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .card {
        background: white;
        padding: 2rem;
        border-radius: 12px;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      }
      h1 {
        font-size: 1.4rem;
        margin-bottom: 0.25rem;
      }
      p.sub {
        color: #666;
        font-size: 0.9rem;
        margin-bottom: 1.5rem;
      }
      label {
        display: block;
        font-size: 0.85rem;
        font-weight: 500;
        margin-bottom: 0.25rem;
        margin-top: 1rem;
      }
      input {
        width: 100%;
        padding: 0.6rem 0.8rem;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 0.95rem;
        outline: none;
        transition: border 0.2s;
      }
      input:focus {
        border-color: #6366f1;
      }
      button {
        width: 100%;
        margin-top: 1.5rem;
        padding: 0.7rem;
        background: #6366f1;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        cursor: pointer;
        font-weight: 500;
      }
      button:hover {
        background: #4f46e5;
      }
      button:disabled {
        background: #a5b4fc;
        cursor: not-allowed;
      }
      .error {
        margin-top: 1rem;
        padding: 0.6rem 0.8rem;
        background: #fef2f2;
        color: #dc2626;
        border-radius: 8px;
        font-size: 0.85rem;
        display: none;
      }
      .success {
        margin-top: 1rem;
        padding: 0.6rem 0.8rem;
        background: #f0fdf4;
        color: #16a34a;
        border-radius: 8px;
        font-size: 0.85rem;
        display: none;
      }
      .footer {
        margin-top: 1.5rem;
        text-align: center;
        font-size: 0.85rem;
        color: #666;
      }
      .footer a {
        color: #6366f1;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Create account</h1>
      <p class="sub">OIDC Auth Server</p>

      <label>Name</label>
      <input type="text" id="name" placeholder="Your name" />

      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com" />

      <label>Password</label>
      <input type="password" id="password" placeholder="Min 8 characters" />

      <div class="error" id="error"></div>
      <div class="success" id="success"></div>

      <button id="btn" onclick="handleRegister()">Create account</button>

      <div class="footer">
        Already have an account? <a href="/ui/login.html">Sign in</a>
      </div>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const next = params.get("next");

      async function handleRegister() {
        const btn = document.getElementById("btn");
        const error = document.getElementById("error");
        const success = document.getElementById("success");
        error.style.display = "none";
        success.style.display = "none";
        btn.disabled = true;
        btn.textContent = "Creating account...";

        try {
          const res = await fetch("/admin/users/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              name: document.getElementById("name").value,
              email: document.getElementById("email").value,
              password: document.getElementById("password").value,
            }),
          });

          const data = await res.json();

          if (!res.ok) {
            error.textContent = data.error || "Registration failed";
            error.style.display = "block";
            return;
          }

          success.textContent = "Account created! Redirecting to login...";
          success.style.display = "block";
          setTimeout(() => {
            window.location.href = `/ui/login.html${next ? `?next=${encodeURIComponent(next)}` : ""}`;
          }, 1500);
        } catch (e) {
          error.textContent = "Something went wrong";
          error.style.display = "block";
        } finally {
          btn.disabled = false;
          btn.textContent = "Create account";
        }
      }

      document.addEventListener("keydown", (e) => {
        if (e.key === "Enter") handleRegister();
      });
    </script>
  </body>
</html>
